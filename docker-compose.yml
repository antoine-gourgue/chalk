services:
  postgres:
    image: postgres:17-alpine
    container_name: chalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalk}
      POSTGRES_DB: ${POSTGRES_DB:-chalk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chalk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalk} -d ${POSTGRES_DB:-chalk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chalk-pgdata:
